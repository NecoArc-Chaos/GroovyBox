[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "groovybox"
version = "1.0.0"
description = "A modern cross-platform music player"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
    "flet>=0.27.0",
    "flet-audio>=0.27.0",
    "mutagen>=1.47.0",
    "Pillow>=10.0.0",
    "colorthief>=0.2.1",
    "httpx>=0.27.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.0",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.flet.windows]
dependencies = [
    "pystray>=0.19.0",
    "watchdog>=3.0.0",
]

[tool.flet.linux]
dependencies = [
    "pystray>=0.19.0",
    "watchdog>=3.0.0",
]

[tool.flet.macos]
dependencies = [
    "pystray>=0.19.0",
    "watchdog>=3.0.0",
]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "B904"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
