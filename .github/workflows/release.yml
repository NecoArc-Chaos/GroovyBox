name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLET_VERSION: '0.85.3'

jobs:
  build-all:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            artifact: GroovyBox-Windows
          - platform: linux
            os: ubuntu-latest
            artifact: GroovyBox-Linux
          - platform: macos
            os: macos-latest
            artifact: GroovyBox-macOS
          - platform: android
            os: ubuntu-latest
            artifact: GroovyBox-Android
          - platform: ios
            os: macos-latest
            artifact: GroovyBox-iOS

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: | 
          pip install flet==${{ env.FLET_VERSION }} flet-audio==${{ env.FLET_VERSION }}
          pip install mutagen Pillow colorthief httpx

      - name: Install system deps
        if: matrix.platform == 'linux'
        run: | 
          sudo apt-get update
          sudo apt-get install -y pkg-config libmpv-dev libgtk-3-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ~/.flet/flutter
          key: flutter-${{ env.FLET_VERSION }}

      - name: Decode iOS certificate
        if: matrix.platform == 'ios'
        env:
          IOS_CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$IOS_CERTIFICATE_P12" ]; then
            echo "No iOS certificate provided, skipping signing"
            exit 0
          fi
          echo "$IOS_CERTIFICATE_P12" | base64 -d > certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security import certificate.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A \
            -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> $GITHUB_ENV

      - name: Decode iOS provisioning profile
        if: matrix.platform == 'ios'
        env:
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          if [ -z "$IOS_PROVISIONING_PROFILE" ]; then
            echo "No provisioning profile provided, skipping signing"
            exit 0
          fi
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE" | base64 -d > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | \
            xmllint --xpath "string(//key[.='UUID']/following-sibling::string[1])" -)
          cp profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision
          echo "IOS_PROVISIONING_PROFILE_NAME=$UUID" >> $GITHUB_ENV

      - name: Build (${{ matrix.platform }})
        timeout-minutes: 60
        env:
          PYTHONIOENCODING: utf-8
          # Android signing (optional - unsigned if not provided)
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          # iOS signing (optional - unsigned if not provided)
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          IOS_SIGNING_CERTIFICATE: "Apple Distribution"
        run: python scripts/do_build.py ${{ matrix.platform }}

      - name: Set signing flag
        if: matrix.platform == 'ios'
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$IOS_TEAM_ID" ]; then
            echo "HAS_SIGNING=1" >> $GITHUB_ENV
          else
            echo "HAS_SIGNING=0" >> $GITHUB_ENV
          fi

      - name: Package unsigned IPA
        if: matrix.platform == 'ios' && env.HAS_SIGNING == '0'
        run: |
          APP_PATH=$(find build/ipa -name "*.app" -path "*/Products/Applications/*" | head -1)
          if [ -n "$APP_PATH" ]; then
            mkdir -p build/ipa/Payload
            cp -r "$APP_PATH" build/ipa/Payload/
            cd build/ipa && zip -r -y GroovyBox-unsigned.ipa Payload
            rm -rf Payload
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/${{ matrix.platform == 'android' && 'apk' || matrix.platform == 'ios' && 'ipa' || matrix.platform }}/**/*
          if-no-files-found: error

  release:
    # Only run when a tag is pushed
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-all
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Prepare release files
        run: |
          mkdir -p release-files
          find release-artifacts -type f | while read f; do
            cp "$f" release-files/
          done
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: GroovyBox ${{ github.ref_name }}
          body: |
            Automated build for `${{ github.ref_name }}`.
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: release-files/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
